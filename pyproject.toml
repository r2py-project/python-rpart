[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.16.0", "meson", "ninja", "numpy", "cffi"]

[project]
name = "r2py_rpart"
version = "0.2.0"
description = "Python port of R's rpart: recursive partitioning and regression trees, with a compiled C core callable from Python via cffi."
readme = "README.md"
license = "GPL-2.0-only OR GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-GPL3", "NOTICE"]
authors = [
    {name = "Yufei Cai", email = "ycai9@nd.edu"},
    {name = "Jun Li", email = "jun.li@nd.edu"},
]
requires-python = ">=3.10"
dependencies = ["numpy", "cffi", "pandas", "matplotlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/r2py-project/r2py_rpart"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit Windows is skipped: the MSYS2 MINGW64 toolchain is x86_64-only.
skip = ["*-manylinux_i686", "*-win32"]
build-frontend = "build"

# Linux: GCC and G++ are pre-installed in all manylinux images.
# No external packages needed (rpart has no BLAS/Fortran dependency).

# macOS: Apple clang is the default compiler.  The meson.build already
# selects -lc++ on Darwin, so no extra brew installs are required.

[tool.cibuildwheel.windows]
# MinGW GCC is added to PATH by the workflow step before cibuildwheel runs, which
# is the only place the MSYS2 install location is known.
#
# --analyze-existing is required: this package ships a plain _rpart_core.dll, not a
# .pyd extension module, and delvewheel only follows the dependencies of .pyd files
# unless told otherwise. Without it the MinGW runtime DLLs (libstdc++-6, libgcc_s_seh-1,
# libwinpthread-1) are silently left unbundled and the wheel fails to import.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --analyze-existing -w {dest_dir} {wheel}"
