[build-system]
build-backend = "mesonpy"
requires = ["meson-python", "meson", "ninja", "numpy", "cffi"]

[project]
name = "r2py_rpart"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "cffi"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-manylinux_i686"]
build-frontend = "build"

# Linux: GCC and G++ are pre-installed in all manylinux images.
# No external packages needed (rpart has no BLAS/Fortran dependency).

# macOS: Apple clang is the default compiler.  The meson.build already
# selects -lc++ on Darwin, so no extra brew installs are required.

[tool.cibuildwheel.windows]
# MinGW GCC is added to PATH by the workflow step before cibuildwheel runs.
# delvewheel bundles any MinGW runtime DLLs that the wheel depends on.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
PATH = "C:\\msys64\\mingw64\\bin;{PATH}"
