name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        # ubuntu-latest     = Linux x86_64
        # ubuntu-24.04-arm  = Linux aarch64 (native, no QEMU)
        # macos-15-intel    = macOS x86_64 (Intel, Apple clang)
        # macos-latest      = macOS arm64  (Apple Silicon, Apple clang)
        # windows-latest    = Windows x86_64 (MinGW GCC via MSYS2)

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Point cibuildwheel at the MinGW toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # setup-msys2 installs under RUNNER_TEMP, not C:\msys64. cibuildwheel parses
          # `environment` with bash rules, so backslashes would be eaten as escapes and
          # {PATH} is not a placeholder -- use forward slashes and $PATH.
          mingw="${MSYS2_LOCATION//\\//}/mingw64"
          echo "CIBW_ENVIRONMENT_WINDOWS=PATH=\"$mingw/bin;\$PATH\"" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
